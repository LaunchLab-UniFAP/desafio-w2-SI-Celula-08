name: Validacao Tecnica
on: [push]

jobs:

  teste-si:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Codigo
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Executar Teste Automatizado SI
      run: |
        python -c "
        from src.governanca_si import calcular_eficiencia_financeira
        res = calcular_eficiencia_financeira(10.0)
        if res == 'Alerta: Alto Custo de Ociosidade Detectado':
            print('✅ Teste SI Aprovado!')
        else:
            print('❌ Teste SI Falhou: Logica de calculo de ociosidade incorreta.')
            exit(1)
        "
